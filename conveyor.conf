// Packaging for Ageha.
//
// **Windows only.** CLAUDE.md 9: there is no macOS or Linux target and there will not be one.
// Conveyor is capable of all three and will happily be configured for all three, which is exactly
// how this file ended up declaring six machines that nobody had ever run the app on. Five of them
// were never verified and the sixth could not be built at all.
//
// Conveyor is still the right tool with one target: it produces a signed, self-updating installer
// and the update feed beside it, which jpackage does not.
//
// Conveyor is free for projects under an OSI-approved licence. Ageha is GPL-3.0, so it qualifies,
// and the free licence is activated purely by `app.vcs-url` below -- no signup, no account, no
// key. It carries one obligation: the README must link to Conveyor and say it is used for
// packaging. See the "Packaging" section of README.md, which discharges it.
//
// Build with: conveyor make site
//
// Nothing here restates what the build already knows. The include below runs the Conveyor Gradle
// plugin, which emits the classpath, the JDK, the main class and the per-platform Skia natives.

include "#!./gradlew -q :app:desktop:printConveyorConfig"

app {
  // Activates the free open-source licence. Without it Conveyor asks for a billing email.
  vcs-url = "https://github.com/HolySush1/Ageha"
  license = GPL-3.0-or-later

  // The released version, which is not the Gradle project's.
  //
  // The Gradle plugin hands over `0.2.0-SNAPSHOT`, and a snapshot suffix is not a version any
  // installer format accepts -- Windows MSI product versions in particular are numeric-dotted or
  // nothing. Stripped here rather than in the build, because `-SNAPSHOT` is meaningful to Gradle
  // and to dependency resolution and only meaningless at the point something is packaged.
  // Override for a release build with: conveyor -Kapp.version=1.2.3 make site
  version = "0.3.2"

  display-name = "Ageha"
  // Overrides the Gradle module name, which is "desktop". This is what the user sees as the
  // directory, the binary and the Linux package name.
  fsname = ageha
  rdns-name = app.ageha

  // The update site. GitHub Releases hosts the packages and the update feed alongside them, so a
  // release needs no separate hosting -- and the download URL a user is given is the same URL the
  // updater polls.
  site.base-url = "github.com/HolySush1/Ageha/releases/latest/download"

  // Icons.
  //
  // The files live under `brand/generated/linux/` because that is where `:tools:brandkit` writes
  // its PNG ladder; the directory name is the generator's, not a platform Ageha ships to.
  //
  // The PNG ladder rather than a single source image, deliberately. `:tools:brandkit` already
  // decides what each size should be, and below 48px it substitutes a simplified silhouette --
  // the seal's wing veining turns to mud at 32px and smaller. Handing Conveyor one large image
  // and letting it downscale would throw that work away and produce exactly the mud the
  // simplified variant exists to avoid. See docs/DESIGN.md 7.2.
  icons = [
    "brand/generated/linux/ageha-16.png"
    "brand/generated/linux/ageha-24.png"
    "brand/generated/linux/ageha-32.png"
    "brand/generated/linux/ageha-48.png"
    "brand/generated/linux/ageha-64.png"
    "brand/generated/linux/ageha-128.png"
    "brand/generated/linux/ageha-256.png"
    "brand/generated/linux/ageha-512.png"
  ]

  // The one machine Ageha targets.
  //
  // Not a subset of an eventual three. Windows is the product; see CLAUDE.md 9.
  //
  // **Windows on ARM is deliberately absent, and runs the x64 build under emulation.** That is not
  // a preference: no JDK vendor in Conveyor's index publishes a Windows/AArch64 21, so Conveyor
  // builds the other targets and then fails the entire release with "JAR files were imported but
  // no JVM inputs were supplied for 'windows.aarch64'". An arm64 entry here cannot be built at
  // all, and Windows 11 emulates x64 transparently, so the emulated build is not a degraded
  // option -- it is the only one, and it works.
  machines = [ windows.amd64 ]

  jvm {
    // Ageha reaches outside the JVM in two places, and both need an explicit module.
    //
    // `java.desktop` is AWT: the icon pipeline's `ImageIO`, the font enumeration behind the
    // typography fallback chain, and the native file picker. `java.sql` is what the bundled
    // SQLite driver expects to find. jlink strips anything not asked for, so omitting either
    // produces a build that starts and then fails the first time a user opens a file dialog.
    modules = ${app.jvm.modules} [ java.desktop, java.sql, java.naming ]

    options = [
      // Skia allocates outside the heap, and a webtoon strip is the largest thing Ageha decodes.
      //
      // Raised from 1536m when the reader started composing pages ahead of the viewport. The
      // binding constraint is no longer a single decode but the read-ahead window: Coil sizes its
      // memory cache as a fraction of the heap (`AgehaImages.MEMORY_CACHE_FRACTION`, a quarter),
      // and pages are decoded at the source's own resolution, so a tall strip holds several
      // full-resolution bitmaps warmed ahead of what is on screen. At 1536m that cache was 384MB
      // and evicted pages before they were reached -- the prefetch did the work and then threw it
      // away. 3072m puts the cache at 768MB, which holds the window.
      "-Xmx3072m"
      // The bundled SQLite driver and Skia both load native code from the app directory.
      "-Djava.awt.headless=false"
    ]
  }

  windows {
    // Ageha is a manga reader; a console window flashing up behind it is noise.
    console = false
  }

}

conveyor.compatibility-level = 18
