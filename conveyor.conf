// Packaging for Ageha.
//
// Hydraulic Conveyor builds signed, self-updating installers for Windows, macOS and Linux from
// one machine, which matters here because Ageha is one JVM app with a native Skia backend per
// platform -- and cross-building that with jpackage would mean three CI runners.
//
// Conveyor is free for projects under an OSI-approved licence. Ageha is GPL-3.0, so it qualifies,
// and the free licence is activated purely by `app.vcs-url` below -- no signup, no account, no
// key. It carries one obligation: the README must link to Conveyor and say it is used for
// packaging. See the "Packaging" section of README.md, which discharges it.
//
// Build with:   conveyor make site
// One platform: conveyor -Kapp.machines=windows.amd64 make windows-installer
//
// Nothing here restates what the build already knows. The include below runs the Conveyor Gradle
// plugin, which emits the classpath, the JDK, the main class and the per-platform Skia natives.

include "#!./gradlew -q :app:desktop:printConveyorConfig"

app {
  // Activates the free open-source licence. Without it Conveyor asks for a billing email.
  vcs-url = "https://github.com/Kotatsu-Redo/Ageha"
  license = GPL-3.0-or-later

  display-name = "Ageha"
  // Overrides the Gradle module name, which is "desktop". This is what the user sees as the
  // directory, the binary and the Linux package name.
  fsname = ageha
  rdns-name = app.ageha

  // The update site. GitHub Releases hosts the packages and the update feed alongside them, so a
  // release needs no separate hosting -- and the download URL a user is given is the same URL the
  // updater polls.
  site.base-url = "github.com/Kotatsu-Redo/Ageha/releases/latest/download"

  /*
   * Icons.
   *
   * The PNG ladder rather than a single source image, deliberately. `:tools:brandkit` already
   * decides what each size should be, and below 48px it substitutes a simplified silhouette --
   * the seal's wing veining turns to mud at 32px and smaller. Handing Conveyor one large image
   * and letting it downscale would throw that work away and produce exactly the mud the
   * simplified variant exists to avoid. See docs/DESIGN.md 7.2.
   */
  icons = [
    "brand/generated/linux/ageha-16.png"
    "brand/generated/linux/ageha-24.png"
    "brand/generated/linux/ageha-32.png"
    "brand/generated/linux/ageha-48.png"
    "brand/generated/linux/ageha-64.png"
    "brand/generated/linux/ageha-128.png"
    "brand/generated/linux/ageha-256.png"
    "brand/generated/linux/ageha-512.png"
  ]

  // Every desktop Ageha targets. arm64 is not optional any more: Apple Silicon is the majority of
  // Macs sold, and Windows on ARM is no longer a rounding error.
  machines = [
    windows.amd64
    windows.aarch64
    mac.amd64
    mac.aarch64
    linux.amd64.glibc
    linux.aarch64.glibc
  ]

  jvm {
    /*
     * Ageha reaches outside the JVM in two places, and both need an explicit module.
     *
     * `java.desktop` is AWT: the icon pipeline's `ImageIO`, the font enumeration behind the
     * typography fallback chain, and the native file picker. `java.sql` is what the bundled
     * SQLite driver expects to find. jlink strips anything not asked for, so omitting either
     * produces a build that starts and then fails the first time a user opens a file dialog.
     */
    modules = ${app.jvm.modules} [ java.desktop, java.sql, java.naming ]

    options = [
      // Skia allocates outside the heap, and a webtoon strip is the largest thing Ageha decodes.
      "-Xmx1536m"
      // The bundled SQLite driver and Skia both load native code from the app directory.
      "-Djava.awt.headless=false"
    ]
  }

  windows {
    // Ageha is a manga reader; a console window flashing up behind it is noise.
    console = false
  }

  mac {
    info-plist {
      // Ageha reads local CBZ archives the user opens from Finder.
      CFBundleDocumentTypes = [
        {
          CFBundleTypeName = "Comic book archive"
          CFBundleTypeRole = Viewer
          LSItemContentTypes = [ "public.zip-archive" ]
          CFBundleTypeExtensions = [ cbz, zip ]
        }
      ]
      // No camera, microphone or location. Saying so explicitly keeps a future dependency from
      // quietly adding an entitlement nobody reviewed.
      NSHighResolutionCapable = true
    }
  }

  linux {
    desktop-file."Desktop Entry" {
      Categories = "Graphics;Viewer;"
      Comment = "A desktop manga reader"
      MimeType = "application/vnd.comicbook+zip;application/zip;"
    }
  }
}

conveyor.compatibility-level = 18
