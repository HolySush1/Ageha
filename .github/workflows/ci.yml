# The ordinary build. Runs on every push and pull request.
#
# Hermetic: no network-tagged tests, no live sources. Those live in source-smoke.yml, once a night,
# where being slow and occasionally red for reasons outside the repository does not block anyone.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Windows, and only Windows.
  #
  # This was a three-runner matrix, on the reasoning that file locking, path handling and the
  # native SQLite and Skia bits differ per platform. That reasoning is sound for software that
  # ships to three platforms. Ageha ships to one (CLAUDE.md 9), so two thirds of every CI run was
  # spent proving things about platforms with no users -- and worse than merely wasted: a red
  # macOS runner blocks a Windows-only release, which is precisely what happened the first time
  # this workflow ran against a real push.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      # The reports, whenever the suite goes red.
      #
      # Gradle's console output truncates a stack to its first line, which for an assertion is
      # enough and for a *timeout* is not: `UncompletedCoroutinesError at TestBuilders.kt:353`
      # names the mechanism and nothing about which coroutine, which test, or what it was waiting
      # on. That was the whole of the evidence the first time this suite failed here, and it cost
      # a round trip through CI to learn nothing.
      #
      # `if: failure()` rather than `always()`: a green run's reports are noise, and this is the
      # only artifact anyone would download while looking at a red one.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

      # Proves the application actually composes against the real graph -- the real parsers build
      # through the classloader boundary, the real database, the real screens -- without a display.
      # A green unit suite does not catch a shell that opens blank.
      - name: Render the shell headlessly
        run: ./gradlew :app:desktop:renderShell --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-windows
          path: app/desktop/build/shell/
