# Nightly check that the sources still work.
#
# This is how a dead source is discovered before a user reports it. It is the only check in the
# repository that touches the live internet, and it is deliberately the only one -- the unit suite
# stays hermetic and fast, and this runs once a night where slowness does not matter.
#
# It does *not* fail the build for individual dead sources. At any given time a meaningful share of
# the 1360 sources are down, blocked or serving nothing; that is the ordinary state of the
# scanlation web, not a regression. It fails only when the failures are numerous *and alike*, which
# is what a broken Ageha looks like and a broken internet does not. See `Smoke.kt`.
name: source-smoke

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "How many sources to exercise"
        default: "25"
      seed:
        description: "Sampling seed, to reproduce an earlier run"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Generous, because each source gets up to 45 seconds and CI runners have slow DNS.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Exercise a sample of sources
        id: smoke
        run: |
          # The seed is derived from the date when not given, so a night's run is reproducible
          # from its own log -- the command prints the seed it used.
          seed="${{ inputs.seed }}"
          if [ -z "$seed" ]; then seed=$(date +%Y%m%d); fi
          ./gradlew :app:cli:run --no-daemon --quiet \
            --args="smoke --sample ${{ inputs.sample || 25 }} --seed $seed" | tee smoke.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: smoke.txt

      - name: Raise an issue if Ageha looks broken
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.existsSync("smoke.txt") ? fs.readFileSync("smoke.txt", "utf8") : "(no report)";
            const title = "Nightly smoke test suggests Ageha is broken, not the sites";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "smoke",
            });
            // One open issue at a time. A week of nightly failures should be one thread, not seven.
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ["smoke", "automated"],
              body: [
                "The nightly smoke test failed in a way that does not look like ordinary site breakage:",
                "most of the sample failed, and failed the *same way*.",
                "",
                "Individual dead sources never trigger this. Suspect the parsers build or Ageha's",
                "HTTP stack -- `:core:network` and `:core:jvmcontext` first.",
                "",
                "```",
                report.slice(-4000),
                "```",
              ].join("\n"),
            });
