# Builds and publishes the installer, on a tag.
#
# One runner, one target: Windows on x64 (CLAUDE.md 9). Conveyor still earns its place with a
# single platform -- it produces a signed, self-updating package and the update feed beside it,
# which jpackage does not -- and it runs on Linux here because that is the only OS its own build
# action supports, not because anything is built for Linux.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Nothing is released that has not passed the suite. A release build is the one place where
      # "it compiled" is not good enough.
      - name: Test
        run: ./gradlew build --no-daemon

      # Pinned, because there is no "latest" download.
      #
      # This step used to fetch `conveyor-latest-linux-amd64.deb`, which 404s -- Hydraulic
      # publishes per-version tarballs and no floating alias, so the URL was wrong from the day it
      # was written and only failed the first time a tag was actually pushed. A pinned version is
      # also the honest thing for a release job: the tool that builds an installer should not
      # change underneath it without somebody deciding to change it.
      - name: Install Conveyor
        env:
          CONVEYOR_VERSION: "22.2"
        run: |
          wget -q "https://downloads.hydraulic.dev/conveyor/conveyor-$CONVEYOR_VERSION-linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/conveyor"
          tar xzf "conveyor-$CONVEYOR_VERSION-linux-amd64.tar.gz" -C "$RUNNER_TEMP/conveyor"
          echo "$RUNNER_TEMP/conveyor/conveyor-$CONVEYOR_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build and publish the site
        env:
          # Conveyor pushes the packages and the update feed to the release the tag created, so
          # the URL a user downloads from is the URL the updater polls.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Conveyor refuses to run without this. Version 1 is the current EULA.
          CONVEYOR_AGREE_TO_LICENSE: 1
          # The root key every build is signed with, and the reason updates work *between*
          # releases: an installed copy only accepts an update signed by the key it already
          # trusts. Conveyor will not invent one non-interactively -- it asks for a passphrase,
          # finds no console, and exits 2 -- so this is not optional for a release that runs
          # unattended. See docs/RELEASING.md for how it was generated and what happens if it is
          # ever lost.
          CONVEYOR_SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
        run: |
          # The version comes from the tag, not from the build file, so a release cannot be cut
          # with a version that disagrees with what it is tagged.
          version="${GITHUB_REF_NAME#v}"
          conveyor -Kapp.signing-key="$CONVEYOR_SIGNING_KEY" -Kapp.version="$version" make copied-site

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: output/

      # Two different kinds of signing, and they are worth not confusing.
      #
      # The *root key* is set, so every release shares one app identity and an installed copy will
      # accept the next release as an update. That is the one that had to be right.
      #
      # There is still no *code-signing certificate*: Windows SmartScreen and macOS Gatekeeper warn
      # on first run. That is a paid cost Conveyor's free open-source licence does not cover, and
      # docs/RELEASING.md lists the routes to one. Said out loud on every run, because a user who
      # meets SmartScreen with no warning concludes the download is malware.
      - name: Note the signing status
        run: |
          echo "::notice::These installers are not code-signed. Windows SmartScreen and macOS"
          echo "::notice::Gatekeeper will warn on first run. See docs/RELEASING.md."
