# Builds and publishes installers, on a tag.
#
# One runner, six targets. Conveyor cross-builds Windows, macOS and Linux packages from a single
# machine, which is why the Compose Desktop Skia natives for every platform are declared in
# app/desktop/build.gradle.kts rather than relying on whatever the runner happens to be. A
# jpackage-based release would need three runners and could not produce a shared update feed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Nothing is released that has not passed the suite. A release build is the one place where
      # "it compiled" is not good enough.
      - name: Test
        run: ./gradlew build --no-daemon

      - name: Install Conveyor
        run: |
          wget -q https://downloads.hydraulic.dev/conveyor/conveyor-latest-linux-amd64.deb
          sudo apt-get install -y ./conveyor-latest-linux-amd64.deb

      - name: Build and publish the site
        env:
          # Conveyor pushes the packages and the update feed to the release the tag created, so
          # the URL a user downloads from is the URL the updater polls.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The version comes from the tag, not from the build file, so a release cannot be cut
          # with a version that disagrees with what it is tagged.
          version="${GITHUB_REF_NAME#v}"
          conveyor -Kapp.version="$version" make copied-site

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: output/

      # Unsigned, and the release notes have to say so or users meet SmartScreen with no warning.
      # Code-signing certificates are a separate paid cost that Conveyor's free open-source
      # licence does not cover; docs/RELEASING.md lists the routes to getting one.
      - name: Note the signing status
        run: |
          echo "::notice::These installers are unsigned. Windows SmartScreen and macOS Gatekeeper"
          echo "::notice::will warn on first run. See docs/RELEASING.md."
