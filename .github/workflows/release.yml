# Builds and publishes installers, on a tag.
#
# One runner, six targets. Conveyor cross-builds Windows, macOS and Linux packages from a single
# machine, which is why the Compose Desktop Skia natives for every platform are declared in
# app/desktop/build.gradle.kts rather than relying on whatever the runner happens to be. A
# jpackage-based release would need three runners and could not produce a shared update feed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Nothing is released that has not passed the suite. A release build is the one place where
      # "it compiled" is not good enough.
      - name: Test
        run: ./gradlew build --no-daemon

      # Pinned, because there is no "latest" download.
      #
      # This step used to fetch `conveyor-latest-linux-amd64.deb`, which 404s -- Hydraulic
      # publishes per-version tarballs and no floating alias, so the URL was wrong from the day it
      # was written and only failed the first time a tag was actually pushed. A pinned version is
      # also the honest thing for a release job: the tool that builds an installer should not
      # change underneath it without somebody deciding to change it.
      - name: Install Conveyor
        env:
          CONVEYOR_VERSION: "22.2"
        run: |
          wget -q "https://downloads.hydraulic.dev/conveyor/conveyor-$CONVEYOR_VERSION-linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/conveyor"
          tar xzf "conveyor-$CONVEYOR_VERSION-linux-amd64.tar.gz" -C "$RUNNER_TEMP/conveyor"
          echo "$RUNNER_TEMP/conveyor/conveyor-$CONVEYOR_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build and publish the site
        env:
          # Conveyor pushes the packages and the update feed to the release the tag created, so
          # the URL a user downloads from is the URL the updater polls.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Conveyor refuses to run without this. Version 1 is the current EULA.
          CONVEYOR_AGREE_TO_LICENSE: 1
        run: |
          # The version comes from the tag, not from the build file, so a release cannot be cut
          # with a version that disagrees with what it is tagged.
          version="${GITHUB_REF_NAME#v}"
          conveyor -Kapp.version="$version" make copied-site

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: output/

      # Two separate things are unsigned here and they are worth not confusing.
      #
      # No *code-signing certificate*: Windows SmartScreen and macOS Gatekeeper warn on first run.
      # That is a paid cost Conveyor's free open-source licence does not cover, and
      # docs/RELEASING.md lists the routes to one.
      #
      # No stable *root key* either: `app.signing-key` is unset, so Conveyor mints a throwaway one
      # per run and every release therefore has a different app identity. Installers work; updates
      # between releases do not. Setting `CONVEYOR_SIGNING_KEY` fixes it, and until somebody does,
      # this says so on every run rather than leaving it to be discovered by a user whose update
      # check silently never finds anything. See docs/RELEASING.md.
      - name: Note the signing status
        run: |
          echo "::notice::These installers are unsigned. Windows SmartScreen and macOS Gatekeeper"
          echo "::notice::will warn on first run. See docs/RELEASING.md."
          echo "::warning::Built with a throwaway root key: this release cannot be auto-updated"
          echo "::warning::from or to. Set a stable app.signing-key. See docs/RELEASING.md."
