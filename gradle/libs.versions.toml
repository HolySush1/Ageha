# Versions are deliberately aligned with what kotatsu-parsers-redo builds against
# (see reference/kotatsu-parsers-redo/gradle/libs.versions.toml and docs/FINDINGS.md 2).
# Drifting below those versions breaks the parsers at runtime, not at compile time.

[versions]
kotlin = "2.2.10"
coroutines = "1.10.2"
okhttp = "5.1.0"
okio = "3.16.0"
jsoup = "1.21.2"
json = "20240303"
androidx-collection = "1.5.0"
kotlinx-serialization = "1.9.0"
junit = "5.13.4"

# The parsers library. There are no version tags upstream: this is a commit SHA on
# Kotatsu-Redo/kotatsu-parsers-redo master. See docs/FINDINGS.md 1 before bumping it.
parsers = "434030d481"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# Transitive deps of the parsers library that Android excludes and desktop must NOT.
# See docs/FINDINGS.md 2.
json = { module = "org.json:json", version.ref = "json" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "androidx-collection" }

kotatsu-parsers = { module = "com.github.Kotatsu-Redo:kotatsu-parsers-redo", version.ref = "parsers" }

junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
