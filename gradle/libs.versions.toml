# Versions are deliberately aligned with what kotatsu-parsers-redo builds against
# (see reference/kotatsu-parsers-redo/gradle/libs.versions.toml and docs/FINDINGS.md 2).
# Drifting below those versions breaks the parsers at runtime, not at compile time.

[versions]
kotlin = "2.2.10"
coroutines = "1.10.2"
okhttp = "5.1.0"
okio = "3.16.0"
jsoup = "1.21.2"
json = "20240303"
androidx-collection = "1.5.0"
kotlinx-serialization = "1.9.0"
junit = "5.13.4"
ksp = "2.2.10-2.0.2"
room = "2.8.4"
sqlite = "2.7.0"

# Compose Multiplatform 1.12.0 is the current stable (2026-08-25). The Compose compiler is a
# Kotlin compiler plugin now, so its version tracks `kotlin` above, not `compose`.
compose = "1.12.0"
# Material 3 versions independently of the Compose Multiplatform plugin now, which is why the
# plugin's `compose.material3` shorthand is deprecated in favour of naming the artifact.
compose-material3 = "1.9.0"
# Frozen upstream at 1.7.3, and that is fine here: the artifact is static vector path data, not
# code, and icon outlines do not need maintenance. JetBrains' migration path is Material Symbols
# as vector resources, which would mean the Compose resources Gradle plugin for a handful of
# glyphs. Revisit if we ever need symbols this set does not carry.
compose-material-icons = "1.7.3"

# Coil 3 for cover art. The OkHttp network layer is not optional here: Coil defaults to Ktor off
# Android, and CLAUDE.md forbids Ktor because the parsers library is built on OkHttp.
#
# Pinned below the newest release on purpose. Coil 3.5+ depends on Kotlin stdlib 2.4, whose
# metadata this project's Kotlin 2.2.10 compiler cannot read -- and `kotlin` is aligned with what
# kotatsu-parsers-redo builds against, so raising it to chase an image library would be the tail
# wagging the dog. 3.4.0 is the newest Coil whose metadata is readable here. The root build also
# forces the stdlib to `kotlin` above, so a future transitive bump fails loudly rather than
# producing this error somewhere unrelated.
coil = "3.4.0"

# DI. Koin rather than Hilt/Dagger -- no annotation processing, and it is not Android-coupled.
koin = "4.2.2"

# Rhino for the PLAIN_SCRIPT JavaScript tier. Pure Java: no native library, and therefore no
# per-platform packaging problem. See docs/ARCHITECTURE.md 5 for why this is not QuickJS.
rhino = "1.9.1"

# JCEF, for the browser component -- the PAGE_CONTEXT / REQUEST_INTERCEPTION / INTERACTIVE_BROWSER
# tiers that around 20 of the 1,360 sources need. See docs/FINDINGS.md 4 C1.
#
# The version tracks Chromium's: 146.0.10 is Chromium 146. Bumping it changes the user-agent the
# browser presents, which is load-bearing -- see JcefJsRuntime.browserUserAgent.
jcef = "146.0.10"

# Hydraulic Conveyor. Free for OSS under an OSI-approved licence, which GPL-3.0 is; the licence is
# activated by setting `app.vcs-url` in conveyor.conf and carries one obligation, which the README
# discharges. See docs/RELEASING.md.
conveyor = "2.0"

# Build-time only: Google's Material colour science (HCT/CAM16), used by :tools:brandkit to
# derive the tonal palettes from the brand seed. It is NOT a dependency of the app -- the
# generated tokens are committed as literal hex. See docs/DESIGN.md 2.
material-color-utilities = "0.1.2"

# The parsers library. There are no version tags upstream: this is a commit SHA on
# Kotatsu-Redo/kotatsu-parsers-redo master. See docs/FINDINGS.md 1 before bumping it.
parsers = "434030d481"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
conveyor = { id = "dev.hydraulic.conveyor", version.ref = "conveyor" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# `Dispatchers.Main` on the JVM, resolved through a `ServiceLoader`. Without it `Dispatchers.Main`
# does not fall back to anything -- every use *throws*, and Compose Multiplatform 1.12's
# `compose.desktop.currentOs` does not bring it. Not theoretical: Coil builds `enqueue`'s request
# scope on the main dispatcher, so the reader's page prefetch threw on every call and
# `PreloadPages` swallowed it. Ageha shipped with the read-ahead silently doing nothing.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# Transitive deps of the parsers library that Android excludes and desktop must NOT.
# See docs/FINDINGS.md 2.
json = { module = "org.json:json", version.ref = "json" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "androidx-collection" }

kotatsu-parsers = { module = "com.github.Kotatsu-Redo:kotatsu-parsers-redo", version.ref = "parsers" }

junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Room 2.7+ is a Kotlin Multiplatform library with JVM as a first-class target, so it runs on
# desktop without Android. sqlite-bundled ships its own SQLite build rather than relying on the
# platform's, which desktop does not have. docs/ARCHITECTURE.md 1.3.
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

material-color-utilities = { module = "me.tatarka.google.material:material-color-utilities", version.ref = "material-color-utilities" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
jcef = { module = "me.friwi:jcefmaven", version.ref = "jcef" }
